function parseScript(script) {
  if (!script) return [];
  return script.split("\n").filter(l => l.trim()).map(line => {
    const t = line.trim();
    if (t.startsWith("SAY:")) return { type: "say", text: t.slice(4).trim() };
    if (t.startsWith("ASK:")) return { type: "ask", text: t.slice(4).trim() };
    if (t.startsWith("ENGAGE:")) return { type: "engage", text: t.slice(7).trim() };
    if (t.startsWith("READ:") || t.startsWith("Read ")) return { type: "read", text: t };
    if (t.startsWith("[") && t.endsWith("]")) return { type: "dir", text: t };
    return { type: "p", text: t };
  });
}

  ],

function getSupplyRows(roomId, c) {
  const spec = SUPPLY_SPEC[roomId];
  if (!spec) return [];
  return spec.map(item => {
    const supplies = c[item.supplies];
    if (!supplies || !supplies.trim() || supplies.trim().toLowerCase() === "none") return null;
    const name = item.name ? c[item.name] : null;
    return { label: item.label, name: name && name.trim() ? name : null, supplies };
  }).filter(Boolean);
}

// Warns if an imported JSON blob contains room keys the renderers don't know about.
// The original app imported unknown keys silently and the room just rendered empty.
function unknownRooms(contentObj) {
  return Object.keys(contentObj || {}).filter(k => !TEMPLATE_ORDER.includes(k));
}

function BlockRenderer({ blocks }) {
  return blocks.map((b, i) => {
    if (!b) return null;
    switch (b.type) {
      case "banner": return <div key={i} className="print-banner" style={{background:C.deep,color:"white",padding:"14px 20px",borderRadius:8,marginBottom:16}}><div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}><div dangerouslySetInnerHTML={{__html:LOGO_SVG}} className="logo-container" style={{height:48}}/></div><div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><div style={{fontSize:20,fontWeight:700}}>{b.text}</div>{b.scripture && <div style={{fontSize:14,fontWeight:600,opacity:0.8}}>{b.scripture}</div>}</div></div>;
      case "field": return <div key={i} className="print-field" style={{padding:"2px 0",fontSize:13}}><strong style={{color:C.deep}}>{b.label}:</strong> {b.value || <span style={{color:"#ccc"}}>—</span>}</div>;
      case "section": return <div key={i} className="print-section" style={{background:C.deep,color:"white",padding:"8px 14px",borderRadius:4,marginTop:20,marginBottom:8,fontSize:13,fontWeight:700,letterSpacing:0.5}}>{b.text}</div>;
      case "sectionLabel": return <div key={i} className="print-sectionLabel" style={{background:C.sky,color:"white",padding:"6px 14px",borderRadius:4,marginTop:20,marginBottom:8,fontSize:12,fontWeight:700,letterSpacing:1}}>{b.text}</div>;
      case "subsection": return <div key={i} className="print-subsection" style={{fontWeight:700,color:C.sky,fontSize:14,marginTop:16,marginBottom:6,borderBottom:`1px solid ${C.foam}`,paddingBottom:4}}>{b.text}</div>;
      case "say": return <div key={i} style={{marginBottom:6,paddingLeft:4}}><strong style={{color:C.deep}}>SAY:</strong> {b.text}</div>;
      case "ask": return <div key={i} style={{marginBottom:6,paddingLeft:4}}><strong style={{color:C.sky}}>ASK:</strong> {b.text}</div>;
      case "engage": return <div key={i} style={{marginBottom:6,background:C.foam,padding:"5px 10px",borderRadius:4}}><strong style={{color:C.deep}}>ENGAGE:</strong> {b.text}</div>;
      case "read": return <div key={i} style={{marginBottom:6,fontWeight:600,color:C.sage}}>{b.text}</div>;
      case "dir": return <div key={i} style={{marginBottom:6,fontStyle:"italic",color:"#777",fontSize:13}}>{b.text}</div>;
      case "p": return <div key={i} style={{marginBottom:6}}>{b.text}</div>;
      case "devotional": return <div key={i} style={{marginBottom:6}}>{b.text.split("\n\n").map((para,pi)=><p key={pi} style={{margin:"0 0 10px 0"}}>{para}</p>)}</div>;
      case "bold": return <div key={i} className="print-bold-label" style={{marginBottom:6,fontWeight:700}}>{b.text}</div>;
      case "verse": return <div key={i} style={{marginBottom:6,fontStyle:"italic",color:C.deep,background:C.light,padding:"6px 10px",borderRadius:4,borderLeft:`3px solid ${C.sky}`}}>{b.text}</div>;
      case "placeholder": return <div key={i} style={{marginBottom:6,color:"#bbb",fontStyle:"italic",padding:"8px 12px",border:"1px dashed #ddd",borderRadius:4}}>⬜ {b.text}</div>;
      case "table": return <table key={i} style={{width:"100%",borderCollapse:"collapse",marginBottom:12,fontSize:12}}><thead><tr>{b.rows[0].map((h,j)=><th key={j} style={{background:C.deep,color:"white",padding:"6px 10px",textAlign:"left",fontWeight:600}}>{h}</th>)}</tr></thead><tbody>{b.rows.slice(1).map((row,ri)=><tr key={ri}>{row.map((cell,ci)=><td key={ci} style={{padding:"5px 10px",borderBottom:"1px solid #eee",background:ri%2===0?"#fff":C.light}}>{cell}</td>)}</tr>)}</tbody></table>;
      case "spacer": return <div key={i}>{Array.from({length:b.lines||6},(_,j)=><br key={j}/>)}</div>;
      default: return <div key={i}>{b.text}</div>;
    }
  });
}

        {tab === "documents" && (
          <div>
            <div className="no-print" style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:16}}>
              {TEMPLATE_ORDER.map(id => {
                const filled = filledDocs.includes(id);
                return <button key={id} onClick={()=>setActiveDoc(id)} style={{padding:"6px 12px",border:`2px solid ${activeDoc===id?C.coral:filled?C.sage:"#ddd"}`,borderRadius:16,cursor:"pointer",fontSize:11,fontWeight:activeDoc===id?700:500,background:activeDoc===id?C.coral:filled?"#f0f8f0":"white",color:activeDoc===id?"white":filled?C.deep:"#999"}}>{SHORT_NAMES[id]}{filled?" ✓":""}</button>;
              })}
              <button onClick={()=>{window.print()}} id="dl-btn" style={{marginLeft:"auto",padding:"6px 14px",border:`2px solid ${C.deep}`,borderRadius:16,cursor:"pointer",fontSize:11,fontWeight:600,background:"white",color:C.deep}}>📥 Save as PDF</button>
            </div>
            <div id="doc-content" style={{lineHeight:1.6}}>
              <BlockRenderer blocks={docBlocks} />
            </div>
          </div>
        )}

        {tab === "supplies" && (
          <div>
            <div className="no-print" style={{display:"flex",alignItems:"center",marginBottom:16}}>
              <div style={{fontSize:11,color:"#666"}}>One-page supply summary across all rooms</div>
              <button onClick={()=>{window.print()}} style={{marginLeft:"auto",padding:"6px 14px",border:`2px solid ${C.deep}`,borderRadius:16,cursor:"pointer",fontSize:11,fontWeight:600,background:"white",color:C.deep}}>📥 Save as PDF</button>
            </div>
            <div style={{lineHeight:1.5}}>
              <div style={{background:C.deep,color:"white",padding:"12px 16px",marginBottom:16}}>
                <div style={{fontSize:11,opacity:0.7,textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>Supply Summary</div>
                <div style={{fontSize:18,fontWeight:700}}>{shared.event_name || "(Untitled Lesson)"}</div>
                {shared.scripture_ref && <div style={{fontSize:12,opacity:0.85,marginTop:2}}>{shared.scripture_ref}</div>}
              </div>
              {Object.keys(SUPPLY_SPEC).map(roomId => {
                const rows = getSupplyRows(roomId, content[roomId]||{});
                if (rows.length === 0) return (
                  <div key={roomId} style={{marginBottom:16,opacity:0.45}}>
                    <div style={{fontWeight:700,color:C.deep,fontSize:13,borderBottom:`1px solid #ddd`,paddingBottom:4,marginBottom:6}}>{ROOM_FULL_NAMES[roomId]}</div>
                    <div style={{fontSize:12,fontStyle:"italic",color:"#888",paddingLeft:8}}>No supplies listed</div>
                  </div>
                );
                return (
                  <div key={roomId} style={{marginBottom:16}}>
                    <div style={{fontWeight:700,color:C.deep,fontSize:13,borderBottom:`1px solid #ddd`,paddingBottom:4,marginBottom:6}}>{ROOM_FULL_NAMES[roomId]}</div>
                    {rows.map((r,i) => (
                      <div key={i} style={{marginBottom:8,paddingLeft:8}}>
                        <div style={{fontSize:12,fontWeight:600,color:C.deep}}>
                          {r.label}{r.name ? <span style={{color:"#666",fontWeight:500}}>: "{r.name}"</span> : null}
                        </div>
                        <div style={{fontSize:13,color:"#333",marginTop:2}}>{r.supplies}</div>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
      <div className="no-print" style={{textAlign:"center",padding:12,fontSize:10,color:"#bbb"}}>{SERIES.title} Formatter • Data persists in browser (key: {SERIES.storageKey})</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
